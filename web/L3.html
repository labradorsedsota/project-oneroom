<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project OneRoom - L3: Patience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #eee;
        }
        #game-container { position: relative; }
        canvas {
            border: 2px solid #444;
            background: #16213e;
            display: block;
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #level-info { margin-top: 20px; font-size: 14px; color: #888; }
        #controls { margin-top: 10px; font-size: 12px; color: #666; }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            display: none;
        }
        #nav {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        #nav a {
            color: #888;
            text-decoration: none;
            padding: 5px 15px;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 13px;
        }
        #nav a:hover { color: #fff; border-color: #888; }
        #nav a.active { color: #4ade80; border-color: #4ade80; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="hint">Hold Your Breath</div>
        <div id="message"></div>
    </div>
    <div id="level-info">L3: Patience</div>
    <div id="controls">Don't move. Just wait. | R: Restart</div>
    <div id="nav">
        <a href="index.html">L1</a>
        <a href="L2.html">L2</a>
        <a href="L3.html" class="active">L3</a>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');

        // Game constants
        const GRAVITY = 0.5;
        const GROUND_Y = 500;
        const PLAYER_WIDTH = 32;
        const PLAYER_HEIGHT = 48;
        const DOOR_WIDTH = 16;
        const DOOR_HEIGHT = 96;
        const WAIT_TIME = 5000; // 5 seconds in ms

        // Game state
        let gameState = 'playing'; // playing, complete
        let waitTimer = 0;
        let lastInputTime = 0;
        let heartbeatPhase = 0;
        let playerMoved = false;

        // Player
        const playerStart = { x: 400, y: GROUND_Y - PLAYER_HEIGHT };
        let player = {
            x: playerStart.x,
            y: playerStart.y,
            vx: 0,
            vy: 0,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            speed: 5,
            jumpForce: -12,
            onGround: false,
            color: '#3b82f6',
            breathPhase: 0
        };

        // Door - no button this time, opens after waiting
        const door = {
            x: 900 - DOOR_WIDTH / 2,
            y: GROUND_Y - DOOR_HEIGHT,
            width: DOOR_WIDTH,
            height: DOOR_HEIGHT,
            open: false,
            openProgress: 0,
            color: '#6b7280',
            openColor: '#4ade80'
        };

        // Input tracking
        const keys = {};
        let anyKeyPressed = false;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') e.preventDefault();
            if (e.key.toLowerCase() === 'r') restart();
            if (['a', 'd', ' ', 'w', 'arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(e.key.toLowerCase())) {
                anyKeyPressed = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function restart() {
            player.x = playerStart.x;
            player.y = playerStart.y;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            player.breathPhase = 0;
            door.open = false;
            door.openProgress = 0;
            gameState = 'playing';
            waitTimer = 0;
            lastInputTime = Date.now();
            playerMoved = false;
            messageEl.style.display = 'none';
        }

        function rectCollision(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function showMessage(text, color) {
            messageEl.textContent = text;
            messageEl.style.color = color;
            messageEl.style.display = 'block';
        }

        let lastTime = Date.now();

        function update() {
            if (gameState !== 'playing') return;

            const now = Date.now();
            const dt = now - lastTime;
            lastTime = now;

            // Check if player is pressing any movement key
            const isMoving = keys['a'] || keys['d'] || keys[' '] || keys['w'] ||
                            keys['arrowleft'] || keys['arrowright'] || keys['arrowup'] || keys['arrowdown'];

            if (isMoving) {
                // Player moved - reset timer
                waitTimer = 0;
                lastInputTime = now;
                playerMoved = true;
            } else {
                // Player is still - accumulate wait time
                waitTimer += dt;
            }

            // Open door after waiting long enough
            if (waitTimer >= WAIT_TIME && !door.open) {
                door.open = true;
            }

            // Horizontal movement
            if (keys['a'] || keys['arrowleft']) {
                player.vx = -player.speed;
            } else if (keys['d'] || keys['arrowright']) {
                player.vx = player.speed;
            } else {
                player.vx *= 0.8;
                if (Math.abs(player.vx) < 0.1) player.vx = 0;
            }

            // Jump
            if ((keys[' '] || keys['w'] || keys['arrowup']) && player.onGround) {
                player.vy = player.jumpForce;
                player.onGround = false;
            }

            // Gravity
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;

            // Ground
            if (player.y + player.height >= GROUND_Y) {
                player.y = GROUND_Y - player.height;
                player.vy = 0;
                player.onGround = true;
            }

            // Bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Door animation
            if (door.open && door.openProgress < 1) {
                door.openProgress += 0.02;
                if (door.openProgress > 1) door.openProgress = 1;
            }

            // Door collision
            const playerRect = { x: player.x, y: player.y, width: player.width, height: player.height };
            if (door.openProgress < 0.9) {
                const doorRect = {
                    x: door.x,
                    y: door.y + (door.height * door.openProgress),
                    width: door.width,
                    height: door.height * (1 - door.openProgress)
                };
                if (rectCollision(playerRect, doorRect)) {
                    if (player.vx > 0) {
                        player.x = doorRect.x - player.width;
                    } else if (player.vx < 0) {
                        player.x = doorRect.x + doorRect.width;
                    }
                    player.vx = 0;
                }
            }

            // Goal
            if (door.open && door.openProgress >= 0.9) {
                const goalRect = { x: door.x - 16, y: door.y, width: door.width + 32, height: door.height };
                if (rectCollision(playerRect, goalRect)) {
                    gameState = 'complete';
                    showMessage('Level Complete!', '#4ade80');
                }
            }

            // Breathing animation
            player.breathPhase += 0.03;
            heartbeatPhase += isMoving ? 0.15 : 0.05;
        }

        function draw() {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#374151';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // Door
            if (door.openProgress < 1) {
                const slideOffset = door.height * door.openProgress;
                ctx.fillStyle = door.open ? door.openColor : door.color;
                ctx.fillRect(door.x, door.y - slideOffset, door.width, door.height);
            }

            // Door frame
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 2;
            ctx.strokeRect(door.x - 4, door.y - 4, door.width + 8, door.height + 8);

            // Goal glow
            if (door.open && door.openProgress >= 0.9) {
                const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.5;
                ctx.fillStyle = `rgba(74, 222, 128, ${pulse})`;
                ctx.fillRect(door.x - 8, door.y, door.width + 16, door.height);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('→', door.x + door.width / 2, door.y + door.height / 2 + 8);
            }

            // Player with breathing animation
            const breathOffset = Math.sin(player.breathPhase) * 2;
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y + breathOffset, player.width, player.height - breathOffset);
            ctx.fillStyle = '#fff';
            const eyeX = player.vx > 0 ? player.x + 20 : player.x + 8;
            ctx.fillRect(eyeX, player.y + 12 + breathOffset, 6, 6);

            // Timer display - heartbeat style
            const progress = Math.min(waitTimer / WAIT_TIME, 1);
            const isMoving = keys['a'] || keys['d'] || keys[' '] || keys['w'] ||
                            keys['arrowleft'] || keys['arrowright'] || keys['arrowup'] || keys['arrowdown'];

            // Heartbeat indicator
            const heartSize = 20 + Math.sin(heartbeatPhase) * (isMoving ? 8 : 3);
            const heartX = canvas.width / 2;
            const heartY = 80;

            ctx.fillStyle = isMoving ? '#ef4444' : '#4ade80';
            ctx.font = `${heartSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('♥', heartX, heartY);

            // Progress bar
            const barWidth = 200;
            const barHeight = 8;
            const barX = heartX - barWidth / 2;
            const barY = heartY + 20;

            ctx.fillStyle = '#374151';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = isMoving ? '#ef4444' : '#4ade80';
            ctx.fillRect(barX, barY, barWidth * progress, barHeight);

            // Timer text
            const secondsLeft = Math.max(0, (WAIT_TIME - waitTimer) / 1000).toFixed(1);
            ctx.fillStyle = '#888';
            ctx.font = '14px Courier New';
            ctx.fillText(isMoving ? 'Moving... timer reset' : `${secondsLeft}s`, heartX, barY + 25);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        lastTime = Date.now();
        gameLoop();
    </script>
</body>
</html>
