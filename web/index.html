<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project OneRoom</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #eee;
        }
        #game-container { position: relative; }
        canvas {
            border: 2px solid #444;
            background: #16213e;
            display: block;
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            z-index: 10;
        }
        #overlay.show { display: flex; }
        #overlay-text {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        #overlay-btn {
            padding: 12px 32px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #4ade80;
            border: 2px solid #4ade80;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #overlay-btn:hover {
            background: #4ade80;
            color: #1a1a2e;
        }
        #overlay-btn.restart {
            color: #ef4444;
            border-color: #ef4444;
        }
        #overlay-btn.restart:hover {
            background: #ef4444;
            color: #fff;
        }
        #level-info { margin-top: 20px; font-size: 14px; color: #888; }
        #controls { margin-top: 10px; font-size: 12px; color: #666; }
        #nav {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-btn {
            padding: 6px 16px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #888;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { color: #fff; border-color: #888; }
        .nav-btn.active { color: #4ade80; border-color: #4ade80; }
        .nav-btn.completed { color: #4ade80; border-color: #2d6a4f; }
        .nav-btn.locked { color: #444; border-color: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="1280" height="720"></canvas>
        <div id="hint"></div>
        <div id="overlay">
            <div id="overlay-text"></div>
            <button id="overlay-btn"></button>
        </div>
    </div>
    <div id="level-info"></div>
    <div id="controls"></div>
    <div id="nav"></div>

    <script>
    // ============================================================
    // ENGINE
    // ============================================================
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hintEl = document.getElementById('hint');
    const overlayEl = document.getElementById('overlay');
    const overlayText = document.getElementById('overlay-text');
    const overlayBtn = document.getElementById('overlay-btn');
    const levelInfoEl = document.getElementById('level-info');
    const controlsEl = document.getElementById('controls');
    const navEl = document.getElementById('nav');

    const GRAVITY = 0.5;
    const GROUND_Y = 500;

    // Global state
    let currentLevel = 0;
    let gameState = 'playing';
    let completedLevels = new Set();
    let keys = {};
    let levelData = {};

    // Input
    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') e.preventDefault();
        if (e.key.toLowerCase() === 'r') restartLevel();
    });
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // Mouse events for levels that need them
    canvas.addEventListener('mousemove', (e) => {
        if (LEVELS[currentLevel] && LEVELS[currentLevel].onMouseMove) {
            LEVELS[currentLevel].onMouseMove(e);
        }
    });
    canvas.addEventListener('click', (e) => {
        if (gameState === 'playing' && LEVELS[currentLevel] && LEVELS[currentLevel].onClick) {
            LEVELS[currentLevel].onClick(e);
        }
    });

    function rectCollision(a, b) {
        return a.x < b.x + b.width && a.x + a.width > b.x &&
               a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function showOverlay(text, color, btnText, btnClass, callback) {
        overlayText.textContent = text;
        overlayText.style.color = color;
        overlayBtn.textContent = btnText;
        overlayBtn.className = btnClass || '';
        overlayBtn.onclick = callback;
        overlayEl.classList.add('show');
    }

    function hideOverlay() {
        overlayEl.classList.remove('show');
    }

    function restartLevel() {
        hideOverlay();
        loadLevel(currentLevel);
    }

    function nextLevel() {
        hideOverlay();
        if (currentLevel + 1 < LEVELS.length) {
            loadLevel(currentLevel + 1);
        }
    }

    // ============================================================
    // LEVEL DEFINITIONS
    // ============================================================
    const LEVELS = [
        // --- L1: The Button ---
        {
            name: 'L1: The Button',
            hint: 'Under Pressure',
            controls: 'A/D: Move | Space: Jump | R: Restart',
            init() {
                return {
                    player: { x: 200, y: GROUND_Y - 48, vx: 0, vy: 0, width: 32, height: 48, speed: 4, jumpForce: -11, onGround: false, color: '#3b82f6' },
                    button: { x: 616, y: GROUND_Y - 16, width: 48, height: 16, pressed: false, activated: false },
                    door: { x: 892, y: GROUND_Y - 96, width: 16, height: 96, open: false, openProgress: 0 }
                };
            },
            update(d) {
                const p = d.player, b = d.button, dr = d.door;
                // Movement
                if (keys['a'] || keys['arrowleft']) p.vx = -p.speed;
                else if (keys['d'] || keys['arrowright']) p.vx = p.speed;
                else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
                if ((keys[' '] || keys['w']) && p.onGround) { p.vy = p.jumpForce; p.onGround = false; }
                p.vy += GRAVITY; p.x += p.vx; p.y += p.vy;
                if (p.y + p.height >= GROUND_Y) { p.y = GROUND_Y - p.height; p.vy = 0; p.onGround = true; }
                if (p.x < 0) p.x = 0;
                if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;

                // Button collision
                const pB = p.y + p.height, pT = p.y, pR = p.x + p.width, pL = p.x;
                const bT = b.y, bB = b.y + b.height, bL = b.x, bR = b.x + b.width;
                const ox = pR > bL && pL < bR, oy = pB > bT && pT < bB;
                if (ox && oy) {
                    const oL = pR - bL, oR = bR - pL, oT = pB - bT, oB = bB - pT;
                    const mx = Math.min(oL, oR), my = Math.min(oT, oB);
                    if (my < mx) {
                        if (oT < oB && p.vy >= 0) {
                            p.y = bT - p.height; p.vy = 0; p.onGround = true; b.pressed = true;
                            if (!b.activated) { b.activated = true; dr.open = true; }
                        } else if (oB < oT) { p.y = bB; p.vy = 0; }
                    } else {
                        if (oL < oR) p.x = bL - p.width; else p.x = bR;
                        p.vx = 0;
                    }
                } else { b.pressed = b.activated; }

                // Door
                if (dr.open && dr.openProgress < 1) { dr.openProgress += 0.02; if (dr.openProgress > 1) dr.openProgress = 1; }
                const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                if (dr.openProgress < 0.9) {
                    const dRect = { x: dr.x, y: dr.y + dr.height * dr.openProgress, width: dr.width, height: dr.height * (1 - dr.openProgress) };
                    if (rectCollision(pr, dRect)) {
                        if (p.vx > 0) p.x = dRect.x - p.width; else if (p.vx < 0) p.x = dRect.x + dRect.width;
                        p.vx = 0;
                    }
                }
                if (dr.open && dr.openProgress >= 0.9) {
                    if (rectCollision(pr, { x: dr.x - 16, y: dr.y, width: dr.width + 32, height: dr.height })) return 'complete';
                }
                return null;
            },
            draw(d) {
                const p = d.player, b = d.button, dr = d.door;
                // Button
                ctx.fillStyle = b.activated ? '#ef4444' : '#fbbf24';
                const by = b.pressed ? b.y + 4 : b.y, bh = b.pressed ? b.height - 4 : b.height;
                ctx.fillRect(b.x, by, b.width, bh);
                ctx.fillStyle = '#4b5563'; ctx.fillRect(b.x - 4, b.y + b.height, b.width + 8, 4);
                if (b.activated) { ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15; ctx.fillRect(b.x, by, b.width, bh); ctx.shadowBlur = 0; }
                // Door
                if (dr.openProgress < 1) {
                    const so = dr.height * dr.openProgress;
                    ctx.fillStyle = dr.open ? '#4ade80' : '#6b7280';
                    ctx.fillRect(dr.x, dr.y - so, dr.width, dr.height);
                }
                ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
                ctx.strokeRect(dr.x - 4, dr.y - 4, dr.width + 8, dr.height + 8);
                if (dr.open && dr.openProgress >= 0.9) {
                    const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.5;
                    ctx.fillStyle = `rgba(74,222,128,${pulse})`; ctx.fillRect(dr.x - 8, dr.y, dr.width + 16, dr.height);
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('→', dr.x + dr.width / 2, dr.y + dr.height / 2 + 8);
                }
                // Player
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.vx > 0 ? p.x + 20 : p.x + 8, p.y + 12, 6, 6);
            }
        },

        // --- L2: The Decoy ---
        {
            name: 'L2: The Decoy',
            hint: 'Ignore It',
            controls: 'A/D: Move | Space: Jump | R: Restart',
            init() {
                return {
                    player: { x: 200, y: GROUND_Y - 48, vx: 0, vy: 0, width: 32, height: 48, speed: 4, jumpForce: -11, onGround: false, color: '#3b82f6' },
                    button: { x: 616, y: GROUND_Y - 16, width: 48, height: 16, pressed: false, activated: false },
                    door: { x: 892, y: GROUND_Y - 96, width: 16, height: 96, open: false, locked: false, openProgress: 0 }
                };
            },
            update(d) {
                const p = d.player, b = d.button, dr = d.door;
                if (keys['a'] || keys['arrowleft']) p.vx = -p.speed;
                else if (keys['d'] || keys['arrowright']) p.vx = p.speed;
                else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
                if ((keys[' '] || keys['w']) && p.onGround) { p.vy = p.jumpForce; p.onGround = false; }
                p.vy += GRAVITY; p.x += p.vx; p.y += p.vy;
                if (p.y + p.height >= GROUND_Y) { p.y = GROUND_Y - p.height; p.vy = 0; p.onGround = true; }
                if (p.x < 0) p.x = 0;
                if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;

                // Button collision
                const pB = p.y + p.height, pT = p.y, pR = p.x + p.width, pL = p.x;
                const bT = b.y, bB = b.y + b.height, bL = b.x, bR = b.x + b.width;
                const ox = pR > bL && pL < bR, oy = pB > bT && pT < bB;
                if (ox && oy) {
                    const oL = pR - bL, oR = bR - pL, oT = pB - bT, oB = bB - pT;
                    const mx = Math.min(oL, oR), my = Math.min(oT, oB);
                    if (my < mx) {
                        if (oT < oB && p.vy >= 0) {
                            p.y = bT - p.height; p.vy = 0; p.onGround = true; b.pressed = true;
                            if (!b.activated) { b.activated = true; dr.locked = true; return 'failed'; }
                        } else if (oB < oT) { p.y = bB; p.vy = 0; }
                    } else {
                        if (oL < oR) p.x = bL - p.width; else p.x = bR;
                        p.vx = 0;
                    }
                } else { b.pressed = b.activated; }

                // Door auto-opens when player approaches (if button NOT pressed)
                if (!b.activated && !dr.locked) {
                    const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                    if (rectCollision(pr, { x: dr.x - 32, y: dr.y, width: dr.width + 64, height: dr.height })) dr.open = true;
                }
                if (dr.open && dr.openProgress < 1) { dr.openProgress += 0.02; if (dr.openProgress > 1) dr.openProgress = 1; }
                const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                if (dr.openProgress < 0.9 && !dr.locked) {
                    const dRect = { x: dr.x, y: dr.y + dr.height * dr.openProgress, width: dr.width, height: dr.height * (1 - dr.openProgress) };
                    if (rectCollision(pr, dRect)) {
                        if (p.vx > 0) p.x = dRect.x - p.width; else if (p.vx < 0) p.x = dRect.x + dRect.width;
                        p.vx = 0;
                    }
                }
                if (dr.open && dr.openProgress >= 0.9) {
                    if (rectCollision(pr, { x: dr.x - 16, y: dr.y, width: dr.width + 32, height: dr.height })) return 'complete';
                }
                return null;
            },
            draw(d) {
                const p = d.player, b = d.button, dr = d.door;
                // Button
                ctx.fillStyle = b.activated ? '#ef4444' : '#fbbf24';
                const by = b.pressed ? b.y + 4 : b.y, bh = b.pressed ? b.height - 4 : b.height;
                ctx.fillRect(b.x, by, b.width, bh);
                ctx.fillStyle = '#4b5563'; ctx.fillRect(b.x - 4, b.y + b.height, b.width + 8, 4);
                if (b.activated) { ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15; ctx.fillRect(b.x, by, b.width, bh); ctx.shadowBlur = 0; }
                // Door
                if (dr.locked) {
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(dr.x, dr.y, dr.width, dr.height);
                    ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('🔒', dr.x + dr.width / 2, dr.y + dr.height / 2 + 6);
                } else if (dr.openProgress < 1) {
                    const so = dr.height * dr.openProgress;
                    ctx.fillStyle = dr.open ? '#4ade80' : '#6b7280';
                    ctx.fillRect(dr.x, dr.y - so, dr.width, dr.height);
                }
                ctx.strokeStyle = dr.locked ? '#ef4444' : '#9ca3af'; ctx.lineWidth = 2;
                ctx.strokeRect(dr.x - 4, dr.y - 4, dr.width + 8, dr.height + 8);
                if (dr.open && dr.openProgress >= 0.9) {
                    const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.5;
                    ctx.fillStyle = `rgba(74,222,128,${pulse})`; ctx.fillRect(dr.x - 8, dr.y, dr.width + 16, dr.height);
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('→', dr.x + dr.width / 2, dr.y + dr.height / 2 + 8);
                }
                // Player
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.vx > 0 ? p.x + 20 : p.x + 8, p.y + 12, 6, 6);
            }
        },

        // --- L3: Patience ---
        {
            name: 'L3: Patience',
            hint: 'Hold Your Breath',
            controls: "Don't move. Just wait. | R: Restart",
            init() {
                return {
                    player: { x: 200, y: GROUND_Y - 48, vx: 0, vy: 0, width: 32, height: 48, speed: 4, jumpForce: -11, onGround: false, color: '#3b82f6', breathPhase: 0 },
                    button: { x: 616, y: GROUND_Y - 16, width: 48, height: 16, pressed: false },
                    door: { x: 892, y: GROUND_Y - 96, width: 16, height: 96, open: false, openProgress: 0 },
                    waitTimer: 0,
                    heartbeatPhase: 0,
                    lastTime: Date.now()
                };
            },
            update(d) {
                const p = d.player, dr = d.door;
                const now = Date.now();
                const dt = now - d.lastTime;
                d.lastTime = now;

                const isMoving = keys['a'] || keys['d'] || keys[' '] || keys['w'] ||
                    keys['arrowleft'] || keys['arrowright'] || keys['arrowup'] || keys['arrowdown'];

                if (isMoving) { d.waitTimer = 0; } else { d.waitTimer += dt; }
                if (d.waitTimer >= 5000 && !dr.open) dr.open = true;

                if (keys['a'] || keys['arrowleft']) p.vx = -p.speed;
                else if (keys['d'] || keys['arrowright']) p.vx = p.speed;
                else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
                if ((keys[' '] || keys['w']) && p.onGround) { p.vy = p.jumpForce; p.onGround = false; }
                p.vy += GRAVITY; p.x += p.vx; p.y += p.vy;
                if (p.y + p.height >= GROUND_Y) { p.y = GROUND_Y - p.height; p.vy = 0; p.onGround = true; }
                if (p.x < 0) p.x = 0;
                if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;

                // Button collision (solid obstacle, does nothing)
                const b = d.button;
                const pB = p.y + p.height, pT = p.y, pR = p.x + p.width, pL = p.x;
                const bT = b.y, bB = b.y + b.height, bL = b.x, bR = b.x + b.width;
                const ox = pR > bL && pL < bR, oy = pB > bT && pT < bB;
                if (ox && oy) {
                    const oL = pR - bL, oR = bR - pL, oT = pB - bT, oB = bB - pT;
                    const mx = Math.min(oL, oR), my = Math.min(oT, oB);
                    if (my < mx) {
                        if (oT < oB && p.vy >= 0) { p.y = bT - p.height; p.vy = 0; p.onGround = true; b.pressed = true; }
                        else if (oB < oT) { p.y = bB; p.vy = 0; }
                    } else {
                        if (oL < oR) p.x = bL - p.width; else p.x = bR;
                        p.vx = 0;
                    }
                } else { b.pressed = false; }

                if (dr.open && dr.openProgress < 1) { dr.openProgress += 0.02; if (dr.openProgress > 1) dr.openProgress = 1; }
                const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                if (dr.openProgress < 0.9) {
                    const dRect = { x: dr.x, y: dr.y + dr.height * dr.openProgress, width: dr.width, height: dr.height * (1 - dr.openProgress) };
                    if (rectCollision(pr, dRect)) {
                        if (p.vx > 0) p.x = dRect.x - p.width; else if (p.vx < 0) p.x = dRect.x + dRect.width;
                        p.vx = 0;
                    }
                }
                if (dr.open && dr.openProgress >= 0.9) {
                    if (rectCollision(pr, { x: dr.x - 16, y: dr.y, width: dr.width + 32, height: dr.height })) return 'complete';
                }
                p.breathPhase += 0.03;
                d.heartbeatPhase += isMoving ? 0.15 : 0.05;
                return null;
            },
            draw(d) {
                const p = d.player, dr = d.door, b = d.button;
                // Button (solid obstacle, does nothing)
                ctx.fillStyle = '#fbbf24';
                const by = b.pressed ? b.y + 4 : b.y, bh = b.pressed ? b.height - 4 : b.height;
                ctx.fillRect(b.x, by, b.width, bh);
                ctx.fillStyle = '#4b5563'; ctx.fillRect(b.x - 4, b.y + b.height, b.width + 8, 4);
                // Door
                if (dr.openProgress < 1) {
                    const so = dr.height * dr.openProgress;
                    ctx.fillStyle = dr.open ? '#4ade80' : '#6b7280';
                    ctx.fillRect(dr.x, dr.y - so, dr.width, dr.height);
                }
                ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
                ctx.strokeRect(dr.x - 4, dr.y - 4, dr.width + 8, dr.height + 8);
                if (dr.open && dr.openProgress >= 0.9) {
                    const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.5;
                    ctx.fillStyle = `rgba(74,222,128,${pulse})`; ctx.fillRect(dr.x - 8, dr.y, dr.width + 16, dr.height);
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('→', dr.x + dr.width / 2, dr.y + dr.height / 2 + 8);
                }
                // Player with breathing
                const bo = Math.sin(p.breathPhase) * 2;
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y + bo, p.width, p.height - bo);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.vx > 0 ? p.x + 20 : p.x + 8, p.y + 12 + bo, 6, 6);

                // Heartbeat + progress
                const progress = Math.min(d.waitTimer / 5000, 1);
                const isMoving = keys['a'] || keys['d'] || keys[' '] || keys['w'] ||
                    keys['arrowleft'] || keys['arrowright'] || keys['arrowup'] || keys['arrowdown'];
                const hs = 20 + Math.sin(d.heartbeatPhase) * (isMoving ? 8 : 3);
                const hx = canvas.width / 2, hy = 80;
                ctx.fillStyle = isMoving ? '#ef4444' : '#4ade80';
                ctx.font = `${hs}px Arial`; ctx.textAlign = 'center';
                ctx.fillText('♥', hx, hy);
                // Progress bar
                const barW = 200, barH = 8, barX = hx - barW / 2, barY = hy + 20;
                ctx.fillStyle = '#374151'; ctx.fillRect(barX, barY, barW, barH);
                ctx.fillStyle = isMoving ? '#ef4444' : '#4ade80'; ctx.fillRect(barX, barY, barW * progress, barH);
                const sl = Math.max(0, (5000 - d.waitTimer) / 1000).toFixed(1);
                ctx.fillStyle = '#888'; ctx.font = '14px Courier New';
                ctx.fillText(isMoving ? 'Moving... timer reset' : `${sl}s`, hx, barY + 25);
            }
        },

        // --- L4: The Mouse ---
        {
            name: 'L4: The Mouse',
            hint: 'Hands On',
            controls: 'A/D: Move | Space: Jump | Mouse: Click the circle | R: Restart',
            init() {
                return {
                    player: { x: 200, y: GROUND_Y - 48, vx: 0, vy: 0, width: 32, height: 48, speed: 4, jumpForce: -11, onGround: false, color: '#3b82f6' },
                    sceneButton: { x: 616, y: GROUND_Y - 16, width: 48, height: 16 },

                const pB2 = p.y + p.height, pT2 = p.y, pR2 = p.x + p.width, pL2 = p.x;
                const bT = btn.y, bB = btn.y + btn.height, bL = btn.x, bR = btn.x + btn.width;
                const ox2 = pR2 > bL && pL2 < bR, oy2 = pB2 > bT && pT2 < bB;
                if (ox2 && oy2) {
                    const oL2 = pR2 - bL, oR2 = bR - pL2, oT2 = pB2 - bT, oB2 = bB - pT2;
                    const mx2 = Math.min(oL2, oR2), my2 = Math.min(oT2, oB2);
                    if (my2 < mx2) {
                        if (oT2 < oB2 && p.vy >= 0) {
                            p.y = bT - p.height; p.vy = 0; p.onGround = true; btn.pressed = true;
                            if (!btn.activated) { btn.activated = true; dr.open = true; }
                        } else if (oB2 < oT2) { p.y = bB; p.vy = 0; }
                    } else {
                        if (oL2 < oR2) p.x = bL - p.width; else p.x = bR;
                        p.vx = 0;
                    }
                } else { btn.pressed = btn.activated; }

                // Door
                if (dr.open && dr.openProgress < 1) { dr.openProgress += 0.02; if (dr.openProgress > 1) dr.openProgress = 1; }
                const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                if (dr.openProgress < 0.9) {
                    const dRect = { x: dr.x, y: dr.y + dr.height * dr.openProgress, width: dr.width, height: dr.height * (1 - dr.openProgress) };
                    if (rectCollision(pr, dRect)) {
                        if (p.vx > 0) p.x = dRect.x - p.width; else if (p.vx < 0) p.x = dRect.x + dRect.width;
                        p.vx = 0;
                    }
                }
                if (dr.open && dr.openProgress >= 0.9) {
                    if (rectCollision(pr, { x: dr.x - 16, y: dr.y, width: dr.width + 32, height: dr.height })) return 'complete';
                }
                return null;
            },
            draw(d) {
                const p = d.player, btn = d.button, dr = d.door;

                // Dark overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Player glow (radial gradient)
                const glow = ctx.createRadialGradient(
                    p.x + p.width / 2, p.y + p.height / 2, 0,
                    p.x + p.width / 2, p.y + p.height / 2, d.glowRadius
                );
                glow.addColorStop(0, 'rgba(59, 130, 246, 0.15)');
                glow.addColorStop(0.5, 'rgba(59, 130, 246, 0.05)');
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(p.x - d.glowRadius, p.y - d.glowRadius, p.width + d.glowRadius * 2, p.height + d.glowRadius * 2);

                // Reveal platforms within glow
                for (const plat of d.platforms) {
                    const cx = p.x + p.width / 2, cy = p.y + p.height / 2;
                    const platCx = plat.x + plat.width / 2, platCy = plat.y + plat.height / 2;
                    const dist = Math.sqrt((cx - platCx) ** 2 + (cy - platCy) ** 2);
                    if (dist < d.glowRadius + plat.width / 2) {
                        const alpha = Math.max(0, 1 - dist / (d.glowRadius + plat.width / 2)) * 0.4;
                        ctx.fillStyle = `rgba(55, 65, 81, ${alpha})`;
                        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    }
                }

                // Impact flashes
                d.impactFlashes.forEach(f => {
                    const r = (1 - f.life) * 30;
                    ctx.strokeStyle = f.type === 'land' ? `rgba(74, 222, 128, ${f.life})` : `rgba(239, 68, 68, ${f.life})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
                    ctx.stroke();
                });

                // Door glow only (no rectangle)
                const doorCx = dr.x + dr.width / 2, doorCy = dr.y + dr.height / 2;
                const glowR = 60 + Math.sin(Date.now() / 300) * 5;
                const doorGlow = ctx.createRadialGradient(doorCx, doorCy, 0, doorCx, doorCy, glowR);
                if (dr.open) {
                    doorGlow.addColorStop(0, 'rgba(74, 222, 128, 0.6)');
                    doorGlow.addColorStop(0.4, 'rgba(74, 222, 128, 0.3)');
                    doorGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                } else {
                    doorGlow.addColorStop(0, 'rgba(156, 163, 175, 0.4)');
                    doorGlow.addColorStop(0.4, 'rgba(156, 163, 175, 0.15)');
                    doorGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                }
                ctx.fillStyle = doorGlow;
                ctx.fillRect(doorCx - glowR, doorCy - glowR, glowR * 2, glowR * 2);
                if (dr.open && dr.openProgress >= 0.9) {
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('→', doorCx, doorCy + 8);
                }

                // Button (faintly visible when in glow range)
                const btnDist = Math.sqrt((p.x + p.width / 2 - btn.x - btn.width / 2) ** 2 + (p.y + p.height / 2 - btn.y - btn.height / 2) ** 2);
                if (btnDist < d.glowRadius + 40) {
                    const alpha = Math.max(0, 1 - btnDist / (d.glowRadius + 40)) * 0.6;
                    ctx.fillStyle = btn.activated ? `rgba(239, 68, 68, ${alpha})` : `rgba(251, 191, 36, ${alpha})`;
                    const by = btn.pressed ? btn.y + 4 : btn.y, bh = btn.pressed ? btn.height - 4 : btn.height;
                    ctx.fillRect(btn.x, by, btn.width, bh);
                }

                // Player (glowing)
                ctx.shadowColor = '#3b82f6';
                ctx.shadowBlur = 15;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.vx > 0 ? p.x + 20 : p.x + 8, p.y + 12, 6, 6);
                ctx.shadowBlur = 0;
            }
        },

        // --- L11: The UI ---
        {
            name: 'L11: The UI',
            hint: 'Look Closer',
            controls: 'A/D: Move | Space: Jump | Mouse: ??? | R: Restart',
            init() {
                return {
                    player: { x: 200, y: GROUND_Y - 48, vx: 0, vy: 0, width: 32, height: 48, speed: 4, jumpForce: -11, onGround: false, color: '#3b82f6' },
                    sceneButton: { x: 616, y: GROUND_Y - 16, width: 48, height: 16, pressed: false },
                    door: { x: 892, y: GROUND_Y - 96, width: 16, height: 96, open: false, openProgress: 0 },
                    hud: {
                        gearIcon: { x: 40, y: 30, size: 28, clicked: false, hover: false },
                        scoreText: { x: 1280 - 120, y: 35, text: 'Score: 0' },
                        levelText: { x: 1280 / 2, y: 35, text: 'L11' },
                        barBg: { x: 1280 - 220, y: 50, w: 100, h: 8 },
                        shattering: false,
                        shatterProgress: 0,
                        shards: [],
                        shattered: false
                    },
                    mouseX: 0, mouseY: 0,
                    attemptCount: 0,
                    hintTimer: 0
                };
            },
            update(d) {
                const p = d.player, sb = d.sceneButton, dr = d.door, hud = d.hud;
                if (keys['a'] || keys['arrowleft']) p.vx = -p.speed;
                else if (keys['d'] || keys['arrowright']) p.vx = p.speed;
                else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
                if ((keys[' '] || keys['w']) && p.onGround) { p.vy = p.jumpForce; p.onGround = false; }
                p.vy += GRAVITY; p.x += p.vx; p.y += p.vy;
                if (p.y + p.height >= GROUND_Y) { p.y = GROUND_Y - p.height; p.vy = 0; p.onGround = true; }
                if (p.x < 0) p.x = 0;
                if (p.x + p.width > canvas.width) p.x = canvas.width - p.width;

                // Scene button - solid obstacle, does NOTHING
                const pB = p.y + p.height, pT = p.y, pR = p.x + p.width, pL = p.x;
                const bT = sb.y, bB = sb.y + sb.height, bL = sb.x, bR = sb.x + sb.width;
                const ox = pR > bL && pL < bR, oy = pB > bT && pT < bB;
                if (ox && oy) {
                    const oL = pR - bL, oR = bR - pL, oT = pB - bT, oB = bB - pT;
                    const mx = Math.min(oL, oR), my = Math.min(oT, oB);
                    if (my < mx) {
                        if (oT < oB && p.vy >= 0) {
                            p.y = bT - p.height; p.vy = 0; p.onGround = true;
                            sb.pressed = true;
                            d.attemptCount++;
                        } else if (oB < oT) { p.y = bB; p.vy = 0; }
                    } else {
                        if (oL < oR) p.x = bL - p.width; else p.x = bR;
                        p.vx = 0;
                    }
                } else { sb.pressed = false; }

                // HUD gear icon hover
                if (!hud.shattered && !hud.shattering) {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const mx2 = (d.mouseX - rect.left) * scaleX;
                    const my2 = (d.mouseY - rect.top) * scaleY;
                    const gi = hud.gearIcon;
                    hud.gearIcon.hover = Math.abs(mx2 - gi.x) < gi.size && Math.abs(my2 - gi.y) < gi.size;
                }

                // Shatter animation
                if (hud.shattering && !hud.shattered) {
                    hud.shatterProgress += 0.025;
                    if (hud.shatterProgress >= 1) {
                        hud.shattered = true;
                        dr.open = true;
                    }
                    hud.shards.forEach(s => {
                        s.x += s.vx; s.y += s.vy; s.vy += 0.3;
                        s.rotation += s.rotSpeed; s.alpha -= 0.015;
                    });
                }

                if (d.attemptCount > 2 && !hud.shattered) d.hintTimer += 1;

                // Door
                if (dr.open && dr.openProgress < 1) { dr.openProgress += 0.02; if (dr.openProgress > 1) dr.openProgress = 1; }
                const pr = { x: p.x, y: p.y, width: p.width, height: p.height };
                if (dr.openProgress < 0.9) {
                    const dRect = { x: dr.x, y: dr.y + dr.height * dr.openProgress, width: dr.width, height: dr.height * (1 - dr.openProgress) };
                    if (rectCollision(pr, dRect)) {
                        if (p.vx > 0) p.x = dRect.x - p.width; else if (p.vx < 0) p.x = dRect.x + dRect.width;
                        p.vx = 0;
                    }
                }
                if (dr.open && dr.openProgress >= 0.9) {
                    if (rectCollision(pr, { x: dr.x - 16, y: dr.y, width: dr.width + 32, height: dr.height })) return 'complete';
                }
                return null;
            },
            draw(d) {
                const p = d.player, sb = d.sceneButton, dr = d.door, hud = d.hud;

                // Scene button - looks normal but broken (tiny cracks)
                ctx.fillStyle = '#fbbf24';
                const by = sb.pressed ? sb.y + 4 : sb.y, bh = sb.pressed ? sb.height - 4 : sb.height;
                ctx.fillRect(sb.x, by, sb.width, bh);
                ctx.fillStyle = '#4b5563'; ctx.fillRect(sb.x - 4, sb.y + sb.height, sb.width + 8, 4);
                ctx.strokeStyle = 'rgba(100,100,100,0.4)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(sb.x + 10, sb.y + 2); ctx.lineTo(sb.x + 20, sb.y + sb.height - 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(sb.x + 30, sb.y + 3); ctx.lineTo(sb.x + 38, sb.y + sb.height - 1); ctx.stroke();

                // Door
                if (dr.openProgress < 1) {
                    const so = dr.height * dr.openProgress;
                    ctx.fillStyle = dr.open ? '#4ade80' : '#6b7280';
                    ctx.fillRect(dr.x, dr.y - so, dr.width, dr.height);
                }
                ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
                ctx.strokeRect(dr.x - 4, dr.y - 4, dr.width + 8, dr.height + 8);
                if (dr.open && dr.openProgress >= 0.9) {
                    const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.5;
                    ctx.fillStyle = `rgba(74,222,128,${pulse})`; ctx.fillRect(dr.x - 8, dr.y, dr.width + 16, dr.height);
                    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('→', dr.x + dr.width / 2, dr.y + dr.height / 2 + 8);
                }

                // Player
                ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.vx > 0 ? p.x + 20 : p.x + 8, p.y + 12, 6, 6);

                // === HUD LAYER ===
                if (!hud.shattered) {
                    const hudAlpha = hud.shattering ? Math.max(0, 1 - hud.shatterProgress) : 1;
                    ctx.save();
                    ctx.globalAlpha = hudAlpha;
                    // No background bar - HUD floats on game canvas
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(0, 58, canvas.width, 1);

                    // Only the gear icon - minimal, subtle
                    const gi = hud.gearIcon;
                    if (!hud.shattering) {
                        ctx.font = `${gi.size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillStyle = gi.hover ? '#ffd700' : '#666';
                        ctx.fillText('⚙️', gi.x, gi.y);
                        if (gi.hover) {
                            ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 8;
                            ctx.fillText('⚙️', gi.x, gi.y);
                            ctx.shadowBlur = 0;
                        }
                    }
                    ctx.restore();

                    if (hud.shattering) {
                        hud.shards.forEach(s => {
                            if (s.alpha <= 0) return;
                            ctx.save();
                            ctx.globalAlpha = Math.max(0, s.alpha);
                            ctx.translate(s.x, s.y);
                            ctx.rotate(s.rotation);
                            ctx.fillStyle = s.color;
                            ctx.beginPath();
                            ctx.moveTo(s.points[0].x, s.points[0].y);
                            for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
                            ctx.closePath(); ctx.fill();
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.stroke();
                            ctx.restore();
                        });
                    }
                }

                if (d.attemptCount > 3 && !hud.shattered && !hud.shattering) {
                    const hintAlpha = Math.min((d.hintTimer / 120), 0.4);
                    ctx.fillStyle = `rgba(255,255,255,${hintAlpha})`;
                    ctx.font = '14px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText('...maybe the answer isn\'t in the room?', canvas.width / 2, GROUND_Y + 40);
                }
            },
            onMouseMove(e) { levelData.mouseX = e.clientX; levelData.mouseY = e.clientY; },
            onClick(e) {
                const hud = levelData.hud;
                if (hud.shattered || hud.shattering) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                const gi = hud.gearIcon;
                if (Math.abs(mx - gi.x) < gi.size && Math.abs(my - gi.y) < gi.size) {
                    hud.shattering = true;
                    hud.gearIcon.clicked = true;
                    const shardColors = ['rgba(100,100,120,0.8)', 'rgba(80,80,100,0.7)', 'rgba(120,120,140,0.6)', 'rgba(60,60,80,0.8)'];
                    for (let i = 0; i < 30; i++) {
                        const sx = Math.random() * canvas.width;
                        const sy = Math.random() * 60;
                        const size = 8 + Math.random() * 20;
                        const points = [];
                        const numPoints = 3 + Math.floor(Math.random() * 3);
                        for (let j = 0; j < numPoints; j++) {
                            const angle = (j / numPoints) * Math.PI * 2;
                            const r = size * (0.5 + Math.random() * 0.5);
                            points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
                        }
                        hud.shards.push({
                            x: sx, y: sy,
                            vx: (Math.random() - 0.5) * 8,
                            vy: -2 + Math.random() * 4,
                            rotation: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 0.2,
                            alpha: 1,
                            color: shardColors[Math.floor(Math.random() * shardColors.length)],
                            points: points
                        });
                    }
                }
            }
        }
    ];

    // ============================================================
    // LEVEL LOADER
    // ============================================================
    function loadLevel(index) {
        currentLevel = index;
        gameState = 'playing';
        keys = {};
        const level = LEVELS[index];
        levelData = level.init();
        hintEl.textContent = level.hint;
        levelInfoEl.textContent = level.name;
        controlsEl.textContent = level.controls;
        hideOverlay();
        buildNav();
    }

    function isUnlocked(index) {
        if (index === 0) return true;
        return completedLevels.has(index - 1);
    }

    function buildNav() {
        navEl.innerHTML = '';
        LEVELS.forEach((level, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            const unlocked = isUnlocked(i);
            if (i === currentLevel) btn.classList.add('active');
            else if (completedLevels.has(i)) btn.classList.add('completed');
            else if (!unlocked) btn.classList.add('locked');
            btn.textContent = !unlocked ? `🔒 L${i + 1}` : (completedLevels.has(i) ? '✓ ' : '') + `L${i + 1}`;
            if (unlocked) {
                btn.onclick = () => loadLevel(i);
            }
            navEl.appendChild(btn);
        });
    }

    // ============================================================
    // GAME LOOP
    // ============================================================
    function gameLoop() {
        // Clear
        ctx.fillStyle = '#16213e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Ground
        ctx.fillStyle = '#374151';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

        if (gameState === 'playing') {
            const result = LEVELS[currentLevel].update(levelData);
            if (result === 'complete') {
                gameState = 'complete';
                completedLevels.add(currentLevel);
                buildNav();
                if (currentLevel + 1 < LEVELS.length) {
                    showOverlay('Level Complete!', '#4ade80', 'Next Level →', '', nextLevel);
                } else {
                    showOverlay('All Levels Complete!', '#ffd700', 'Play Again', '', () => loadLevel(0));
                }
            } else if (result === 'failed') {
                gameState = 'failed';
                showOverlay('✗ Door Locked!', '#ef4444', 'Restart (R)', 'restart', restartLevel);
            }
        }

        LEVELS[currentLevel].draw(levelData);
        requestAnimationFrame(gameLoop);
    }

    // Start
    loadLevel(0);
    gameLoop();
    </script>
</body>
